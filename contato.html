<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:ital,wght@0,100..900;1,100..900&family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">    <header>
        <h1>Beatriz Uzai Conceição</h1>
        <h2>Desenvolvedora Web em formação</h2>
        <nav>
            <ul>
                <li><a href="index.html" target="_blank">Sobre mim</a></li>
                <li><a href="currículo.html" target="_blank">Currículo</a></li>
                <li><a href="contato.html" target="_blank">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h3>Fale comigo</h3>
            <form action="/contato" method="post">
                <fieldset>
                    <legend>Dados pessoais</legend>
                        <label for="Nome">Nome completo</label>
                            <input type="text" name="Nome" id="Nome" required>
                        <label for="Email">E-mail</label>    
                            <input type="email" name="Email" id="Email" required> 
                        <label for="Tel">Telefone</label>
                            <input type="tel" name="Tel" id="Tel">
                        <label for="Data">Data de Nascimento</label>    
                            <input type="date" name="Data" id="Data">
                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>
                        <label for="CEP">CEP</label>
                            <input type="text" id="CEP" name="CEP" pattern="[0-9]{8}" placeholder="Somente números" title="Números" minlength="3" required>
                        <label for="Rua">Rua</label>
                            <input type="text" id="Rua">
                        <label for="N°">Número</label>
                            <input type="text" id="N°" min="0" max="999" >
                        <label for="Cid">Cidade</label>
                            <input type="text" id="Cid">
                        <label for="area">Estado</label>
                            <select name="Estado" id="Est">
                                <option value="-">-</option>
                                <option value="GO">Goiás</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="SP">São Paulo</option>
                                <option value="PR">Paraná</option>
                                <option value="RS">Rio Grande do Sul</option>
                        </select>
                </fieldset>
                <fieldset>
                    <legend>Área de interesse</legend>
                        <select name="area" id="area" required>Área
                            <option value="-">-</option>
                            <option value="FE">Front-end</option>
                            <option value="BE">Back-end</option>
                            <option value="BD">Banco de dados</option>
                            <option value="FS">Fullstack</option>
                        </select>
                    <legend>Nível de experiência</legend>
                        <input type="radio" name="nivel" id="ini" value="iniciante">
                            <label for="ini">Iniciante</label>
                        <input type="radio" name="nivel" id="int" value="intermediario">
                            <label for="ini">Intermediário</label>
                        <input type="radio" name="nivel" id="ava" value="avançado">
                            <label for="ini">Avançado</label>
                    <p><textarea name="mensagem" maxlength="500"></textarea></p>
                </fieldset>
                <input type="checkbox" name="Termos de uso" id="Termos de uso" required>
                    <label for="Termos de uso">Li e aceito os termos de uso</label>
                <p><button type="submit">Enviar</button></p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy 2026 Beatriz Uzai C.</p>
        <a href="mailto:beatriz.u.conceicao@aluno.senai.br">Email</a>
    </footer>
</body>
</html>
